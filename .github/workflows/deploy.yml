name: Deploy Avalimo Voice

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/avalimo-voice:latest
            ghcr.io/${{ github.repository_owner }}/avalimo-voice:${{ github.sha }}
          build-args: |
            VITE_VAPI_PUBLIC_KEY=${{ secrets.VAPI_PUBLIC_KEY }}
            VITE_VAPI_FRONT_DESK_ASSISTANT_ID=${{ secrets.VAPI_FRONT_DESK_ASSISTANT_ID }}
            VITE_VAPI_DISPATCH_ASSISTANT_ID=${{ secrets.VAPI_DISPATCH_ASSISTANT_ID }}
            VITE_BOOKING_API_ENDPOINT=${{ secrets.BOOKING_API_ENDPOINT }}
            VITE_VOICE_TRANSFER_PHONE=${{ secrets.VOICE_TRANSFER_PHONE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-coolify:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify webhook
        if: ${{ secrets.COOLIFY_WEBHOOK_URL != '' }}
        run: |
          curl -X POST "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"repository":"${{ github.repository }}","tag":"${{ github.sha }}"}'
