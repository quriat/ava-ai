server {
    listen 5002;
    server_name _;

    client_max_body_size 10m;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # React SPA build output
    root /app/site;
    index index.html;

    # Vite hashed assets & favicon — served straight from disk
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    location = /favicon.svg {
        try_files $uri =404;
    }

    # Blog pages are part of the React SPA now (fetched from /api/blog)
    location ~ ^/blog {
        try_files /index.html =404;
    }

    # Flask backend: API, Square deposit, sitemap, robots, /static fleet images, legacy pages
    location ~ ^/(api|static)/ {
        proxy_pass http://127.0.0.1:5003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~ ^/(deposit|sitemap\.xml|robots\.txt|iah-airport-car-service|hobby-airport-car-service|houston-corporate-car-service|houston-wedding-limo|houston-prom-limo|houston-to-galveston-cruise-transfer|airport-hobby|airport-iah|corporate-transportation|wedding-limo|prom-limo|galveston-cruise-transport) {
        proxy_pass http://127.0.0.1:5003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # New React SPA (homepage)
    location = / {
        try_files /index.html =404;
    }

    # Everything else falls through to Flask (legacy catch-all routes & 404 page)
    location / {
        proxy_pass http://127.0.0.1:5003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
