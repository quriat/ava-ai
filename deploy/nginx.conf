server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Coolify terminates TLS before forwarding requests to this container.
    # Trust its X-Forwarded-Proto header; $scheme is always "http" here.
    if ($host != "avalimo.net") {
        return 301 https://avalimo.net$request_uri;
    }

    if ($http_x_forwarded_proto !~* ^https(?:,|$)) {
        return 301 https://avalimo.net$request_uri;
    }

    # Prerendered pages use clean URLs without a trailing slash. Keep "/" and
    # file URLs unchanged, and preserve any query string on the redirect.
    if ($uri ~ ^(.+)/$) {
        return 301 https://avalimo.net$1$is_args$args;
    }

    location / {
        # Prefer a prerendered directory index (e.g. /blog/slug/index.html)
        # before the directory redirect, so clean URLs serve without a 301.
        try_files $uri $uri/index.html $uri/ /index.html;
    }

    location = /__config.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires off;
    }

    location ~* \.(html)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
