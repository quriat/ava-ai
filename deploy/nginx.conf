# www -> apex: single 301 to the canonical host
server {
    listen 80;
    server_name www.avalimo.net;

    return 301 https://avalimo.net$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Directory redirects (e.g. /iah-airport-limo-service -> /iah-airport-limo-service/)
    # stay relative so the TLS scheme of the original request is preserved.
    # Without this, nginx builds the redirect from the internal plain-HTTP hop
    # and produces an HTTPS->HTTP downgrade redirect.
    absolute_redirect off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Canonical URLs have no trailing slash: strip it with a relative 301 so
    # the TLS scheme of the original request is preserved. /app/ and /driver/
    # are real sub-applications and keep their trailing slash.
    rewrite ^(?!(?:/app|/driver)/)(.+)/$ $1 permanent;

    # Legacy and duplicate URLs from the SEO audit. scripts/prerender.mjs writes
    # the same map as static fallback pages for hosts without this config.
    location = /book { return 301 /#booking-section; }
    location = /privacy { return 301 /privacy-policy; }
    location = /corporate-transportation { return 301 /corporate-chauffeur-houston; }
    location = /galveston-limo { return 301 /galveston-cruise-transportation; }
    location = /blog/luxury-travel-houston-availimo { return 301 /blog/luxury-travel-houston-avalimo; }
    location ~ ^/blog/(luxury-transportation-houston-availimo|luxury-transportation-houston-avalimo|why-choose-availimo-houston-luxury-transportation|why-choose-avalimo-houston-luxury-transportation|choose-avalimo-luxury-transportation-houston)$ {
        return 301 /blog/luxury-transportation-houston;
    }

    # Client app: genuine app route, keep the SPA fallback inside /app/ only
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # Driver app: genuine app route, keep the SPA fallback inside /driver/ only
    location /driver/ {
        try_files $uri $uri/ /driver/index.html;
    }

    # Static assets: long-lived immutable caching.
    # NOTE: add_header in a location replaces inherited server-level headers,
    # so the security headers are repeated here.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        try_files $uri =404;
    }

    # Everything else: real files and static pages only.
    # Unknown paths return a real 404 instead of soft-404ing the homepage.
    location / {
        try_files $uri/index.html $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
