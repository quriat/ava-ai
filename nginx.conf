server {
    listen 80;
    server_name _;
    
    # SEO redirects: consolidate thin/old URLs into new rich landing pages
    # These 301s pass link equity and prevent duplicate content
    location = /airport-hobby { return 301 /hobby-airport-car-service; }
    location = /airport-iah { return 301 /iah-airport-car-service; }
    location = /corporate-transportation { return 301 /houston-corporate-car-service; }
    location = /wedding-limo { return 301 /houston-wedding-limo; }
    location = /prom-limo { return 301 /houston-prom-limo; }
    location = /galveston-cruise-transport { return 301 /houston-to-galveston-cruise-transfer; }
    
    # Trailing slash normalization
    location ~ ^(.*)/$ {
        return 301 $1;
    }
    
    location /api/ {
        proxy_pass http://127.0.0.1:5002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com https://connect.facebook.net https://sandbox.web.squarecdn.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://www.google-analytics.com https://www.facebook.com; media-src 'self' https://assets.mixkit.co; connect-src 'self' https://www.google-analytics.com https://routes.googleapis.com https://sandbox.web.squarecdn.com; frame-src https://sandbox.web.squarecdn.com; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" always;

    # Long-lived cache for static assets (images, CSS, fonts, video)
    location ~* \.(png|jpe?g|webp|gif|svg|ico|css|js|mp4|woff2?|ttf)$ {
        root /app/static;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        root /app/static;
        try_files $uri $uri/ /index.html;
    }
}
