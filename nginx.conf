server {
    listen 80;
    server_name _;
    
    # SEO redirects: consolidate thin/old URLs into new rich landing pages
    # These 301s pass link equity and prevent duplicate content
    location = /airport-hobby { return 301 /hobby-airport-car-service; }
    location = /airport-iah { return 301 /iah-airport-car-service; }
    location = /corporate-transportation { return 301 /houston-corporate-car-service; }
    location = /wedding-limo { return 301 /houston-wedding-limo; }
    location = /prom-limo { return 301 /houston-prom-limo; }
    location = /galveston-cruise-transport { return 301 /houston-to-galveston-cruise-transfer; }
    
    # Trailing slash normalization
    location ~ ^(.*)/$ {
        return 301 $1;
    }
    
    location /api/ {
        proxy_pass http://127.0.0.1:5002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    location / {
        root /app/static;
        try_files $uri $uri/ /index.html;
    }
}
