<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>AvaLimo Driver</title>
<link rel="manifest" href="/driver/manifest.webmanifest">
<link rel="apple-touch-icon" href="/driver/icon-192.png">
<link rel="icon" type="image/png" href="/driver/icon-192.png">
<style>
  :root{
    --gold:#C5A059; --gold-light:#D4AF37; --gold-dark:#A68035;
    --bg:#000000; --panel:#111111; --panel-2:#1a1a1a; --line:#2a2a2a;
    --text:#f5f1e8; --muted:#a89f8d;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh; padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    padding:20px 18px 14px; text-align:center;
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#0a0a0a,#000);
  }
  .logo{font-size:30px; font-weight:800; letter-spacing:3px; color:var(--gold);}
  .logo span{color:var(--text);}
  .tagline{color:var(--muted); font-size:12px; letter-spacing:2px; text-transform:uppercase; margin-top:3px;}
  .app-name{margin-top:8px; display:inline-block; font-size:12px; font-weight:700; letter-spacing:1.5px;
    color:#000; background:var(--gold); border-radius:999px; padding:3px 12px; text-transform:uppercase;}
  main{max-width:560px; margin:0 auto; padding:16px;}

  .trip-card{background:var(--panel); border:1px solid var(--gold-dark); border-radius:14px; padding:20px 18px; margin-bottom:16px;}
  .client{font-size:27px; font-weight:800; line-height:1.2; margin-bottom:4px;}
  .when{color:var(--gold); font-size:17px; font-weight:700; margin-bottom:16px;}
  .field{margin-bottom:13px;}
  .field .k{font-size:11px; font-weight:700; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); margin-bottom:3px;}
  .field .v{font-size:17px; line-height:1.45;}
  .field .v.notes{font-size:15px; color:#e8e0cd;}

  .actions{display:flex; flex-direction:column; gap:10px; margin-bottom:20px;}
  .btn{
    display:block; width:100%; padding:17px; text-align:center; text-decoration:none;
    font-size:17px; font-weight:800; border-radius:12px; border:1px solid var(--line);
    background:var(--panel); color:var(--text); cursor:pointer;
  }
  .btn.gold{background:linear-gradient(180deg,var(--gold-light),var(--gold)); color:#000; border:none;}
  .btn:active{background:var(--panel-2);}
  .btn.gold:active{filter:brightness(1.1);}

  .back-link{display:inline-block; margin-bottom:14px; color:var(--gold); text-decoration:none; font-size:15px; font-weight:700;}
  h2.section{font-size:14px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); margin:6px 0 12px;}
  .saved-card{
    display:block; width:100%; text-align:left; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; padding:15px 16px; margin-bottom:10px; cursor:pointer; color:var(--text);
  }
  .saved-card .sc-when{color:var(--gold); font-weight:700; font-size:14px;}
  .saved-card .sc-client{font-size:18px; font-weight:800; margin:2px 0;}
  .saved-card .sc-route{color:var(--muted); font-size:14px; line-height:1.5;}
  .empty{text-align:center; color:var(--muted); padding:38px 16px; font-size:16px; line-height:1.6;
    background:var(--panel); border:1px dashed var(--line); border-radius:12px;}
  .hidden{display:none !important;}
  footer{text-align:center; color:var(--muted); font-size:12px; padding:18px 10px 26px;}
</style>
</head>
<body>
<header>
  <div class="logo">AVA<span>LIMO</span></div>
  <div class="tagline">Luxury Chauffeur Service · Houston</div>
  <div><span class="app-name">Driver</span></div>
</header>

<main>
  <!-- TRIP DETAIL -->
  <section id="viewTrip" class="hidden">
    <a class="back-link" href="#" id="backLink">← All trips</a>
    <div class="trip-card">
      <div class="client" id="tClient"></div>
      <div class="when" id="tWhen"></div>
      <div class="field"><div class="k">Pickup</div><div class="v" id="tPickup"></div></div>
      <div class="field"><div class="k">Drop-off</div><div class="v" id="tDropoff"></div></div>
      <div class="field hidden" id="fFlight"><div class="k">Flight</div><div class="v" id="tFlight"></div></div>
      <div class="field hidden" id="fVehicle"><div class="k">Vehicle</div><div class="v" id="tVehicle"></div></div>
      <div class="field hidden" id="fNotes"><div class="k">Notes</div><div class="v notes" id="tNotes"></div></div>
    </div>
    <div class="actions">
      <a class="btn gold" id="navPickup" href="#" target="_blank" rel="noopener">🧭 Navigate to Pickup</a>
      <a class="btn" id="navDropoff" href="#" target="_blank" rel="noopener">🧭 Navigate to Drop-off</a>
      <a class="btn" id="callClient" href="#">📞 Call Client</a>
      <a class="btn" id="textClient" href="#">💬 Text Client</a>
    </div>
  </section>

  <!-- SAVED TRIPS -->
  <section id="viewList">
    <h2 class="section">My Trips</h2>
    <div id="feedStatus" style="color:var(--muted); font-size:13px; margin:-6px 0 10px;">Loading live trips…</div>
    <button type="button" id="refreshBtn" style="background:var(--panel); color:var(--gold); border:1px solid var(--line); border-radius:10px; padding:9px 14px; font-size:14px; font-weight:700; margin-bottom:14px; cursor:pointer;">↻ Refresh trips</button>
    <div id="tripsList"></div>
  </section>
</main>

<footer>AvaLimo Driver · Dispatch (832) 567-8050</footer>

<script>
(function(){
  "use strict";
  var STORE_KEY = "avalimo.driverTrips";

  var viewTrip = document.getElementById("viewTrip");
  var viewList = document.getElementById("viewList");

  function loadTrips(){
    try { return JSON.parse(localStorage.getItem(STORE_KEY)) || []; }
    catch(e){ return []; }
  }
  function tripKey(t){
    return [t.client||"", t.date||"", t.time||"", t.pickup||""].join("|");
  }
  function saveTrip(t){
    var trips = loadTrips();
    var key = tripKey(t);
    for(var i = 0; i < trips.length; i++){
      if(tripKey(trips[i]) === key){ trips[i] = t; persist(trips); return; }
    }
    trips.unshift(t);
    persist(trips);
  }
  function persist(trips){
    try { localStorage.setItem(STORE_KEY, JSON.stringify(trips)); } catch(e){}
  }

  function fmtDate(dstr){
    if(!dstr) return "";
    var parts = dstr.split("-");
    if(parts.length !== 3) return dstr;
    var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    if(isNaN(d.getTime())) return dstr;
    return d.toLocaleDateString("en-US", { weekday:"short", month:"short", day:"numeric" });
  }
  function fmtTime(tstr){
    if(!tstr) return "";
    var p = String(tstr).split(":");
    if(p.length < 2) return tstr;
    var h = Number(p[0]), m = Number(p[1]);
    if(isNaN(h) || isNaN(m)) return tstr;
    var d = new Date(); d.setHours(h, m, 0, 0);
    return d.toLocaleTimeString("en-US", { hour:"numeric", minute:"2-digit" });
  }
  function mapsUrl(dest){
    return "https://www.google.com/maps/dir/?api=1&destination=" + encodeURIComponent(dest || "");
  }

  function showTrip(t){
    document.getElementById("tClient").textContent = t.client || "Client";
    var when = fmtDate(t.date);
    if(t.time) when += (when ? " · " : "") + fmtTime(t.time);
    document.getElementById("tWhen").textContent = when;
    document.getElementById("tPickup").textContent = t.pickup || "—";
    document.getElementById("tDropoff").textContent = t.dropoff || "—";

    var fFlight = document.getElementById("fFlight");
    if(t.flight){ document.getElementById("tFlight").textContent = t.flight; fFlight.classList.remove("hidden"); }
    else fFlight.classList.add("hidden");

    var fVehicle = document.getElementById("fVehicle");
    if(t.vehicle){ document.getElementById("tVehicle").textContent = t.vehicle; fVehicle.classList.remove("hidden"); }
    else fVehicle.classList.add("hidden");

    var fNotes = document.getElementById("fNotes");
    if(t.notes){ document.getElementById("tNotes").textContent = t.notes; fNotes.classList.remove("hidden"); }
    else fNotes.classList.add("hidden");

    document.getElementById("navPickup").href = mapsUrl(t.pickup);
    document.getElementById("navDropoff").href = mapsUrl(t.dropoff);
    var phone = (t.phone || "").replace(/[^+\d]/g, "");
    document.getElementById("callClient").href = "tel:" + phone;
    document.getElementById("textClient").href = "sms:" + phone;

    viewTrip.classList.remove("hidden");
    viewList.classList.add("hidden");
    window.scrollTo(0,0);
  }

  var FEED_URL = "https://n8napp.adamj.fit/webhook/driver-feed2-trips?key=C28qQJckj25eTie2sfsLR5gQ";
  var feedTrips = null;

  function mergedTrips(){
    var out = [];
    var seen = {};
    var feed = feedTrips || [];
    feed.forEach(function(t){ out.push(t); seen[tripKey(t)] = 1; });
    loadTrips().forEach(function(t){ if(!seen[tripKey(t)]) out.push(t); });
    return out;
  }

  function fetchFeed(){
    var st = document.getElementById("feedStatus");
    if(st) st.textContent = "Loading live trips…";
    fetch(FEED_URL, { headers: { "Accept": "application/json" } })
      .then(function(r){ if(!r.ok) throw new Error("feed " + r.status); return r.json(); })
      .then(function(data){
        feedTrips = (data && data.trips) || [];
        if(st) st.textContent = "Live trips updated " + new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }) + " · " + feedTrips.length + " upcoming";
        if(!viewList.classList.contains("hidden")) showList();
      })
      .catch(function(){
        if(st) st.textContent = "Couldn't refresh live trips — showing saved trips on this phone.";
        if(!viewList.classList.contains("hidden")) showList();
      });
  }

  function showList(){
    var list = document.getElementById("tripsList");
    var trips = mergedTrips();
    list.innerHTML = "";
    if(!trips.length){
      list.innerHTML = '<div class="empty">No trips yet — live trips from dispatch appear here automatically.</div>';
    } else {
      trips.forEach(function(t){
        var b = document.createElement("button");
        b.type = "button";
        b.className = "saved-card";
        var when = fmtDate(t.date);
        if(t.time) when += (when ? " · " : "") + fmtTime(t.time);
        b.innerHTML = '<div class="sc-when"></div><div class="sc-client"></div><div class="sc-route"></div>';
        b.querySelector(".sc-when").textContent = when;
        b.querySelector(".sc-client").textContent = t.client || "Client";
        b.querySelector(".sc-route").textContent = (t.pickup || "") + " → " + (t.dropoff || "");
        b.addEventListener("click", function(){ showTrip(t); });
        list.appendChild(b);
      });
    }
    viewTrip.classList.add("hidden");
    viewList.classList.remove("hidden");
    window.scrollTo(0,0);
  }

  document.getElementById("backLink").addEventListener("click", function(ev){
    ev.preventDefault();
    showList();
  });

  // Entry: trip details arrive as URL query params from dispatch.
  var q = new URLSearchParams(window.location.search);
  var trip = {
    client: q.get("client") || "",
    phone: q.get("phone") || "",
    date: q.get("date") || "",
    time: q.get("time") || "",
    pickup: q.get("pickup") || "",
    dropoff: q.get("dropoff") || "",
    flight: q.get("flight") || "",
    vehicle: q.get("vehicle") || "",
    notes: q.get("notes") || ""
  };
  var hasTrip = ["client","phone","date","time","pickup","dropoff"].some(function(k){ return q.get(k); });

  document.getElementById("refreshBtn").addEventListener("click", fetchFeed);

  if(hasTrip){
    saveTrip(trip);
    showTrip(trip);
  } else {
    showList();
  }
  fetchFeed();
})();
</script>
</body>
</html>
